amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    random_seed: -1
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    introspection_mode: "disabled"
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667
      search_window: 2.0
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669
      search_window: 2.0
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_object
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - smoother
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false  # false 发布 Twist；true 发布带时间戳的 TwistStamped
    controller_frequency: 10.0  # 控制循环频率（Hz）；应与 model_dt 基本匹配（此处 1 / 0.1 = 10 Hz）
    costmap_update_timeout: 0.30  # 等待代价地图更新的最长时间（秒）
    min_x_velocity_threshold: 0.001  # 小于该值的里程计 x 速度视为 0（m/s）
    min_y_velocity_threshold: 0.5  # 小于该值的里程计 y 速度视为 0；差速车不使用横向速度（m/s）
    min_theta_velocity_threshold: 0.001  # 小于该值的里程计角速度视为 0（rad/s）
    failure_tolerance: 0.3  # 控制器失败后允许继续尝试的时间（秒）；设为 -1 表示一直容忍
    progress_checker_plugins: ["progress_checker"]  # 导航进度检查器实例列表
    goal_checker_plugins: ["general_goal_checker"]  # 到达目标判定器实例列表
    controller_plugins: ["FollowPath"]  # 局部路径跟踪控制器实例列表
    path_handler_plugins: ["PathHandler"]  # 全局路径裁剪、变换和分段处理器实例列表
    use_realtime_priority: false  # 是否尝试为控制线程设置实时调度优先级
    speed_limit_topic: "speed_limit"  # 接收速度区域或外部限速消息的话题

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 简单位移进度检查器
      required_movement_radius: 0.5  # 在允许时间内至少需要移动的距离（m）
      movement_time_allowance: 10.0  # 完成上述最小移动量的允许时间（秒）
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: true
    general_goal_checker:
      stateful: true  # 进入 XY 容差后保持该状态，随后只检查目标朝向
      plugin: "nav2_controller::SimpleGoalChecker"  # 基于位置和航向容差判断是否到达目标
      xy_goal_tolerance: 0.25  # 目标位置容差（m）
      yaw_goal_tolerance: 0.25  # 目标航向容差（rad）
      path_length_tolerance: 1.0  # 允许的剩余路径长度上限（m），避免回环路径过早判定到达
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"  # 支持方向反转点和原地旋转段的路径处理器
      prune_distance: 2.0  # 从机器人当前位置向后裁剪已走路径的最大距离（m）
      enforce_path_inversion: false  # 是否在路径前进/倒退方向切换点处分段并强制执行
      enforce_path_rotation: true  # 是否识别并强制执行路径中的原地旋转段
      inversion_xy_tolerance: 0.2  # 判定已到达方向切换点的位置容差（m）
      inversion_yaw_tolerance: 0.4  # 判定已完成方向切换或旋转的航向容差（rad）
      minimum_rotation_angle: 0.785  # 被识别为原地旋转段的最小角度（rad，约 45°）
      reject_unit_path: false  # 是否拒绝仅含一个位姿点的路径
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"  # MPPI（模型预测路径积分）局部控制器插件

      # 采样与预测时域：总预测时间 = time_steps × model_dt = 2.8 秒
      time_steps: 28  # 每条候选轨迹包含的离散时间步数
      model_dt: 0.1  # 相邻轨迹点的时间间隔（秒）
      model_delay_vx: 0.0  # x 方向速度指令到运动响应的模型延迟（秒）
      model_delay_vy: 0.0  # y 方向速度指令到运动响应的模型延迟（秒）
      model_delay_wz: 0.0  # 角速度指令到运动响应的模型延迟（秒）
      batch_size: 1000  # 每次优化随机采样的候选轨迹数量；越大效果通常越稳但计算量越高
      iteration_count: 1  # 每个控制周期执行的 MPPI 优化迭代次数；通常保持 1 并优先增加 batch_size
      open_loop: false  # false 以最新里程计状态为起点；true 以上一控制预测状态开环推进

      # 运动学与动力学约束
      ax_max: 3.0  # 最大前向加速度（m/s²）
      ax_min: -3.0  # 最大前向减速度，即最小 x 加速度（m/s²）
      ay_max: 0.0  # 最大横向加速度（m/s²）；差速模型设为 0
      ay_min: 0.0  # 最小横向加速度（m/s²）；差速模型设为 0
      az_max: 1.5  # 最大角加速度（rad/s²）
      vx_max: 0.5  # 最大前向线速度（m/s）
      vx_min: -0.0  # 最小前向线速度（m/s）；-0.0 等效 0，禁止倒车
      vy_max: 0.0  # 最大横向速度绝对值（m/s）；仅全向模型使用
      wz_max: 1.9  # 最大角速度绝对值（rad/s）

      # 控制噪声标准差：决定候选控制量在当前最优解附近的探索范围
      vx_std: 0.2  # x 方向线速度采样噪声标准差（m/s）
      vy_std: 0.2  # y 方向线速度采样噪声标准差（m/s）；差速模型基本不使用
      wz_std: 0.4  # 角速度采样噪声标准差（rad/s）

      # MPPI 优化权重与输出
      temperature: 0.3  # 轨迹代价的选择温度；越小越偏向最低代价轨迹，越大越接近候选均值
      gamma: 0.015  # 控制扰动代价系数，用于平衡控制平滑性与控制能量
      visualize: false  # 是否发布候选轨迹可视化；开启会明显增加计算与通信开销
      publish_optimal_trajectory: false  # 是否发布每周期计算出的完整最优预测轨迹
      regenerate_noises: true  # 是否每次迭代重新生成采样噪声；开启可增强随机探索但增加运行抖动

      # 运动模型
      motion_model: "diff_drive"  # 使用的运动模型实例名：差速驱动
      diff_drive:
        plugin: "mppi::DiffDriveMotionModel"  # 差速驱动运动模型插件类型

      # 候选轨迹可视化降采样参数，仅 visualize=true 时生效
      TrajectoryVisualizer:
        trajectory_step: 5  # 每隔多少条候选轨迹发布一条
        time_step: 3  # 每条轨迹每隔多少个时间点发布一个点

      # 对优化后最优轨迹执行最终安全校验
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"  # 默认最优轨迹碰撞验证器
        collision_lookahead_time: 2.0  # 从最优轨迹起点向前检查碰撞的时长（秒）
        consider_footprint: false  # false 按机器人中心点/半径检查；true 使用完整 SE2 足迹，精确但更耗时

      # 参与候选轨迹打分的 critic 插件；总代价由各项加权组合得到
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true  # 是否启用运动学约束 critic
        cost_power: 1  # 代价幂次；1 为线性惩罚，增大后会强化高代价样本的惩罚
        cost_weight: 4.0  # 运动学约束代价权重
      GoalCritic:
        enabled: true  # 是否启用目标位置 critic
        cost_power: 1  # 目标位置代价幂次
        cost_weight: 5.0  # 目标位置代价权重
        threshold_to_consider: 1.4  # 距目标小于该距离时才启用此项（m）
      GoalAngleCritic:
        enabled: true  # 是否启用目标航向 critic
        cost_power: 1  # 目标航向代价幂次
        cost_weight: 3.0  # 目标航向代价权重
        threshold_to_consider: 0.5  # 距目标小于该距离时才要求对准目标航向（m）
      PreferForwardCritic:
        enabled: true  # 是否惩罚倒车，鼓励机器人向前运动
        cost_power: 1  # 前进偏好代价幂次
        cost_weight: 5.0  # 前进偏好代价权重
        threshold_to_consider: 0.5  # 距目标大于该距离时才启用前进偏好（m）
      CostCritic:
        enabled: true  # 是否直接根据局部代价地图栅格值进行避障评分
        cost_power: 1  # 障碍物代价幂次
        #cost_weight: 3.81  # 普通代价地图避障权重，调大避障更积极，调小可能导致贴障绕行
        cost_weight: 5.0  # 普通代价地图避障权重，调大避障更积极，调小可能导致贴障绕行
        near_collision_cost: 253  # 判定接近碰撞的代价地图阈值（253 为内切膨胀障碍）调小避障更积极，调大可能导致贴障绕行
        critical_cost: 300.0  # 轨迹点进入高代价膨胀区域时附加的严重惩罚
        consider_footprint: false  # false 使用中心点/圆形半径；true 使用完整机器人足迹计算代价
        collision_cost: 1000000.0  # 轨迹发生真实碰撞时施加的极大惩罚
        near_goal_distance: 1.0  # 距目标小于该值时减弱普通避障偏好，便于贴近障碍物旁的目标（m）
        trajectory_point_step: 2  # 每隔多少个预测点计算一次代价地图代价
      PathAlignCritic:
        enabled: true  # 是否惩罚轨迹与全局路径横向不对齐
        cost_power: 1  # 路径对齐代价幂次
        cost_weight: 14.0  # 路径对齐代价权重；过大可能限制绕障空间
        max_path_occupancy_ratio: 0.05  # 路径被障碍占据比例超过 5% 时停用对齐项，允许主动绕障
        trajectory_point_step: 4  # 每隔多少个预测点计算一次路径对齐误差
        threshold_to_consider: 0.5  # 距目标大于该距离时才启用路径对齐（m）
        offset_from_furthest: 20  # 用最远已到达路径点之后第 20 个点衡量是否已充分沿路径前进
        use_path_orientations: false  # 是否同时使用全局路径点朝向；Navfn 路径通常保持 false
      PathFollowCritic:
        enabled: true  # 是否鼓励候选轨迹沿全局路径向前推进
        cost_power: 1  # 路径跟随代价幂次
        cost_weight: 5.0  # 路径跟随代价权重
        offset_from_furthest: 5  # 以最远已到达路径点之后第 5 个点作为跟随参考点
        threshold_to_consider: 1.4  # 距目标大于该距离时才启用路径推进项（m）
      PathAngleCritic:
        enabled: true  # 是否惩罚机器人朝向与路径前进方向之间的夹角
        cost_power: 1  # 路径角度代价幂次
        cost_weight: 2.0  # 路径角度代价权重
        offset_from_furthest: 4  # 使用最远已到达路径点之后第 4 个点计算目标路径方向
        threshold_to_consider: 0.5  # 距目标大于该距离时才启用路径角度项（m）
        max_angle_to_furthest: 1.0  # 朝向与参考路径方向夹角超过该值时才施加角度代价（rad）
        mode: 0  # 0 偏好前进；1 前后均可；2 遵循可行路径中记录的行驶方向
      # TwirlingCritic:
      #   enabled: true  # 是否抑制不必要的自旋；默认未加载到 critics 列表中
      #   twirling_cost_power: 1  # 自旋代价幂次
      #   twirling_cost_weight: 5.0  # 自旋惩罚权重

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: KEEPOUT_ZONE_ENABLED
        filter_info_topic: "keepout_costmap_filter_info"
        override_lethal_cost: true
        lethal_override_cost: 200
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # A relative topic will be appended to the parent of the local_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `local_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      introspection_mode: "disabled"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter", "speed_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: KEEPOUT_ZONE_ENABLED
        filter_info_topic: "keepout_costmap_filter_info"
        override_lethal_cost: true
        lethal_override_cost: 200
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: SPEED_ZONE_ENABLED
        filter_info_topic: "speed_costmap_filter_info"
        speed_limit_topic: "speed_limit"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # A relative topic will be appended to the parent of the global_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true
      introspection_mode: "disabled"

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the launch file(s).
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    # yaml_filename: ""
    introspection_mode: "disabled"

keepout_filter_mask_server:
  ros__parameters:
    topic_name: "keepout_filter_mask"
    # yaml_filename: ""

keepout_costmap_filter_info_server:
  ros__parameters:
    type: 0
    filter_info_topic: "keepout_costmap_filter_info"
    mask_topic: "keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    topic_name: "speed_filter_mask"
    # yaml_filename: ""

speed_costmap_filter_info_server:
  ros__parameters:
    type: 1
    filter_info_topic: "speed_costmap_filter_info"
    mask_topic: "speed_filter_mask"
    base: 100.0
    multiplier: -1.0

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
    introspection_mode: "disabled"

planner_server:
  ros__parameters:
    allow_partial_planning: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother", "route_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 2
      # True for Hybrid A* or State Lattice to not smooth over directional changes
      enforce_path_inversion: true
      do_refinement: true
    route_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 5
      # False for Route Server or others where smoothing out sharp corners is OK
      enforce_path_inversion: false
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    introspection_mode: "disabled"
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    enabled: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"

    # Types of docks
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true
      dock_direction: "forward"

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
